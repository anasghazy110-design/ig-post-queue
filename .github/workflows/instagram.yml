name: instagram-publisher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish due posts
        run: python3 publish.py
        env:
          IG_TOKEN_763726933494660: ${{ secrets.IG_TOKEN_763726933494660 }}
          IG_TOKEN_347379155127502: ${{ secrets.IG_TOKEN_347379155127502 }}
          IG_TOKEN_124413020755449: ${{ secrets.IG_TOKEN_124413020755449 }}
          IG_TOKEN_113624588497766: ${{ secrets.IG_TOKEN_113624588497766 }}
          IG_TOKEN_369304739757772: ${{ secrets.IG_TOKEN_369304739757772 }}
          IG_TOKEN_105424514337806: ${{ secrets.IG_TOKEN_105424514337806 }}
          IG_TOKEN_103604014629507: ${{ secrets.IG_TOKEN_103604014629507 }}
          IG_TOKEN_107848178160928: ${{ secrets.IG_TOKEN_107848178160928 }}

      - name: Save queue
        run: |
          git config user.name "scheduler-bot"
          git config user.email "scheduler-bot@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then exit 0; fi
          cp queue.json /tmp/mine.json
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 publish.py merge /tmp/mine.json
            git add -A
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "instagram publish run"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1