name: instagram-publisher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish due posts
        run: python3 publish.py
        env:
          IG_TOKEN_763726933494660: ${{ secrets.IG_TOKEN_763726933494660 }}
          IG_TOKEN_369304739757772: ${{ secrets.IG_TOKEN_369304739757772 }}

      - name: Save queue
        run: |
          git config user.name "scheduler-bot"
          git config user.email "scheduler-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "instagram publish run"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1